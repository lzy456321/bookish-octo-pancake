<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="PocketCanvas - Mobile-first Visual Agent Interface" />
  
  <title>PocketCanvas</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="logo">
        <span class="logo-icon">🎨</span>
        <span class="logo-text">PocketCanvas</span>
      </div>
      <div class="top-actions">
        <button id="btn-reset-view" class="icon-btn" title="Reset View">⌂</button>
        <button id="btn-clear" class="icon-btn" title="Clear Canvas">🗑</button>
      </div>
    </header>

    <!-- Infinite Canvas -->
    <main id="canvas-container">
      <div id="canvas" class="canvas">
        <!-- Nodes and edges will be injected here -->
        <svg id="edges-layer" class="edges-layer"></svg>
        <div id="nodes-layer" class="nodes-layer"></div>
      </div>
    </main>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🧠</div>
      <h2>PocketCanvas</h2>
      <p>Mobile Visual Agent Interface</p>
      <p class="hint">Type something below to start a conversation with the agent</p>
    </div>

    <!-- Bottom Input Bar -->
    <footer class="input-bar">
      <div class="input-wrapper">
        <textarea 
          id="user-input" 
          placeholder="Ask the agent anything..." 
          rows="1"
          enterkeyhint="send"
        ></textarea>
        <button id="btn-send" class="send-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <div class="status-bar">
        <span id="status-text">Ready · Mock Agent</span>
      </div>
    </footer>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
